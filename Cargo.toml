[package]
name = "rust-dock"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.10"
freedesktop-desktop-entry = "0.8.1"
gio = "0.22.6"
glib = { version = "0.22.7", features = ["v2_76"] }
gtk4 = "0.11.3"
gtk4-layer-shell = "0.8.0"
hyprland = "0.3.13"
log = "0.4.32"
notify = "8.2.0"
rust-ini = "0.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
